<style>
/* Layout: un seul écran. Barre haute (nom + réglages), en-tête (date + anneau du jour), panneau Focus (niveau, objectif, minuteur), deux colonnes (rituels | tâches), archipel d'îles, heatmap. Sombre d'abord; accent et fond réglables. */
:root {

  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;

    --bg: #f3f6f2; --panel: #ffffff; --panel-2: #f6f9f5; --line: #dbe3dc; --faint: #b3bfb5;
    --fg: #101611; --muted: #5d695f; --accent: #198036; --accent-ink: #ffffff; --cell0: #e6ece6; --danger: #c2392b; --warn: #b7791f;
    color-scheme: light;

}
:root[data-theme="light"] {
  --bg: #f3f6f2; --panel: #ffffff; --panel-2: #f6f9f5; --line: #dbe3dc; --faint: #b3bfb5;
  --fg: #101611; --muted: #5d695f; --accent: #198036; --accent-ink: #ffffff; --cell0: #e6ece6; --danger: #c2392b; --warn: #b7791f;
  color-scheme: light;
}

* { box-sizing: border-box; }

  /* ---------- Vue « monde » : les îles collées en spirale, en 3D isométrique ---------- */
  var WD = { vth: 0, t: 0, open: false, th: 0.6, tilt: 0.55, zoom: 1, base: 40, auto: true, last: null, raf: 0, sp: {}, items: [], sel: -1, pts: {}, from: null };

  }

    var ci = Math.max(0, CIDS.indexOf(isl.c)), sc = SCENES[ci][isl.i % SCENES[ci].length], r = mul(isl.s), inner = '';

    inner += sc.f(r) + extras(r, sc.p);
    if (isl.rare) inner = grp(0.2, Ci(80, 70, 60, '#ffd35c')) + inner + sparkle(24, 40) + sparkle(138, 54) + sparkle(112, 14);
    e = WD.sp[key] = { img: new Image(), ok: false, p: PAL[sc.p] };
    e.img.onload = function () { e.ok = true; worldDraw(); };
    e.img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 152" width="384" height="365">' + inner + '</svg>');
    return e;
  }
  function worldBuild() {

    WD.items = list.map(function (isl, k) { mx = Math.max(mx, Math.abs(pts[k][0]), Math.abs(pts[k][1])); return { isl: isl, gx: pts[k][0], gy: pts[k][1], sp: sprite(isl) }; });

  function worldSize() {

    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    WD.w = w; WD.h = h; WD.dpr = dpr;

  function worldProj(gx, gy) {

  function worldDraw() {
    if (!WD.open) return;

    worldSize(); W = WD.w; H = WD.h;
    g.setTransform(WD.dpr, 0, 0, WD.dpr, 0, 0);
    var sea = g.createLinearGradient(0, 0, 0, H);
    if (dark) { sea.addColorStop(0, '#14405a'); sea.addColorStop(1, '#091a26'); } else { sea.addColorStop(0, '#d6f2fd'); sea.addColorStop(1, '#7dbfe0'); }
    g.fillStyle = sea; g.fillRect(0, 0, W, H);
    /* vagues qui dérivent + éclats de soleil */

      for (x0 = -10; x0 <= W + 10; x0 += 14) { var wy = yy + Math.sin(x0 * 0.03 + ph) * 3; x0 === -10 ? g.moveTo(x0, wy) : g.lineTo(x0, wy); }

      g.beginPath(); a.forEach(function (q2, j) { j ? g.lineTo(q2.x, q2.y + 8) : g.moveTo(q2.x, q2.y + 8); }); g.closePath(); g.fill();

            F.lastAt = Date.now(); spawnNext(t);
            if (!t.paid) { t.paid = 1; var bn = DB[dOf(t) - 1]; if (dOf(t) === 3) F.hd = (F.hd || 0) + 1; gainXP(bn); toast(T('xpBonus', { n: bn })); }
          }
        }
      }
    }
    else if (act === 'deltask') delTask(id);
    else if (act === 'reset') { S = { demo: false, habits: [], tasks: [], projects: [], log: {}, scores: {} }; ui.open = null; }
    afterToggle();
    render();
    ui.pop = null;
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'ntTime' && /^([01]\d|2[0-3]):[0-5]\d$/.test(e.target.value)) { ST.nt.time = e.target.value; saveST(); NT.sig = ''; ntSync(); }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'editForm') { saveEdit(); return; }
    if (e.target.id === 'obForm') {
      var ov = (e.target.elements.t.value || '').trim();
      if (ov && OB && OB.habits.indexOf(ov) < 0) OB.habits.push(ov);
      renderWelcome(false); var oi = $('#obForm input'); if (oi) oi.focus();
      return;
    }
    var f = e.target, v = (f.elements.t.value || '').trim();
    if (f.id === 'taskForm') {
      if (v) S.tasks.push({ id: uid(), text: v, date: today, done: false, diff: ui.newDiff, proj: ui.proj || '' });
      f.reset();
    } else if (f.id === 'calForm') {
      if (v) S.tasks.push({ id: uid(), text: v, date: ui.calSel < today ? today : ui.calSel, done: false, diff: ui.newDiff, proj: ui.proj || '' });
    } else if (f.id === 'projForm') {
      if (v) { var np = { id: uid(), name: v, c: projs().length % PCOL.length }; projs().push(np); ui.proj = np.id; }
      ui.addProj = false;
    } else if (f.id === 'habitForm') {
      if (v) S.habits.push({ id: uid(), name: v });
      f.reset();
    } else if (f.classList.contains('subform')) {
      var tk = taskById(f.dataset.id);
      if (tk && v && subsOf(tk).length < 30) { tk.subs = subsOf(tk).concat([{ id: uid(), text: v, done: false }]); ui.sub = ui.sub || {}; ui.sub[tk.id] = true; }
      render(); var ni = document.querySelector('.subform[data-id="' + f.dataset.id + '"] input'); if (ni) ni.focus();
      return;
    } else if (f.classList.contains('linkform')) {
      setLink(f.dataset.id, v);
      ui.open = null;
    }
    afterToggle();
    render();
    if (f.id === 'calForm' && $('#calInput')) $('#calInput').focus();
  });

  function openSearch(on) {
    ui.sopen = on; $('#searchBar').hidden = !on || ui.tab !== 'todo'; $('#sbtn').setAttribute('aria-expanded', String(!!on));
    if (on) { if (ui.tab !== 'todo') { setTab('todo'); $('#searchBar').hidden = false; } $('#q').focus(); } else setQ('');
  }
  function setQ(v) {
    ui.q = (v || '').trim().toLowerCase();
    $('#q').value = v || ''; renderHabits(stats()); renderTasks();
    $('#qcount').textContent = ui.q ? T('sCount', { n: S.tasks.filter(function (t) { return taskMatch(t, ui.q); }).length + S.habits.filter(function (h) { return hn(h).toLowerCase().indexOf(ui.q) >= 0; }).length }) : '';
  }
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'q') setQ(e.target.value); });
  function moveTask(id, dir) {
    var ids = Array.prototype.map.call(document.querySelectorAll('#tasks .grip'), function (g) { return g.dataset.grip; }), i = ids.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids.splice(i, 1); ids.splice(j, 0, id); applyOrder(ids); render();
    var g = document.querySelector('.grip[data-grip="' + id + '"]'); if (g) g.focus();
  }
  function applyOrder(ids) { ids.forEach(function (id, k) { var t = taskById(id); if (t) t.ord = (k + 1) * 10; }); }
  var DR = null;
  function dragRows() { return Array.prototype.slice.call(document.querySelectorAll('#tasks > li')).filter(function (r) { return r.querySelector('.grip'); }); }
  document.addEventListener('pointerdown', function (e) {
    var g = e.target.closest && e.target.closest('.grip');
    if (!g || (e.button && e.button !== 0)) return;
    var row = g.closest('.row');
    DR = { id: g.dataset.grip, row: row, y0: e.clientY, moved: false, before: null, g: g, pid: e.pointerId };
    try { g.setPointerCapture(e.pointerId); } catch (x) {}
    row.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('pointermove', function (e) {
    if (!DR) return;
    DR.moved = true; DR.row.style.transform = 'translateY(' + (e.clientY - DR.y0) + 'px)';
    var rows = dragRows().filter(function (r) { return r !== DR.row; }), rb = DR.row.getBoundingClientRect(), cy = rb.top + rb.height / 2, before = null;
    rows.some(function (r) { var b = r.getBoundingClientRect(); if (cy < b.top + b.height / 2) { before = r; return true; } return false; });
    DR.before = before;
    rows.forEach(function (r) { r.classList.toggle('dropbefore', r === before); r.classList.toggle('dropend', !before && r === rows[rows.length - 1]); });
  });
  function dragEnd(e) {
    if (!DR) return;
    var d = DR; DR = null;
    d.row.classList.remove('dragging'); d.row.style.transform = '';
    var rows = dragRows(); rows.forEach(function (r) { r.classList.remove('dropbefore', 'dropend'); });
    if (!d.moved || e.type === 'pointercancel') return;
    var ids = rows.filter(function (r) { return r !== d.row; }).map(function (r) { return r.querySelector('.grip').dataset.grip; });
    var bi = d.before ? ids.indexOf(d.before.querySelector('.grip').dataset.grip) : ids.length;
    ids.splice(bi < 0 ? ids.length : bi, 0, d.id);
    applyOrder(ids); render();
  }
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);
  document.addEventListener('keydown', function (e) {
    var sheet = $('#sheet');
    if (WD.open) {
      if (e.key === 'Escape') { e.preventDefault(); worldClose(); return; }
      if (e.key === 'Tab') { var wf = Array.prototype.slice.call($('#world').querySelectorAll('button,canvas')), w1 = wf[0], w2 = wf[wf.length - 1]; if (e.shiftKey && document.activeElement === w1) { e.preventDefault(); w2.focus(); } else if (!e.shiftKey && document.activeElement === w2) { e.preventDefault(); w1.focus(); } }
      return;
    }
    if (e.target && e.target.classList && e.target.classList.contains('grip') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); moveTask(e.target.dataset.grip, e.key === 'ArrowUp' ? -1 : 1); return; }
    if (e.target && e.target.id === 'editSubIn' && e.key === 'Enter') { e.preventDefault(); editSubAdd(); return; }
    if (e.target && e.target.id === 'q' && e.key === 'Escape') { openSearch(false); $('#sbtn').focus(); return; }
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute && e.target.getAttribute('role') === 'tab') {
      var ni = (TABS.indexOf(ui.tab) + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
      setTab(TABS[ni]); $('#tabbtn-' + TABS[ni]).focus(); return;
    }
    if (e.key === 'Escape') {
      if (MOD) { modalClose(); return; }
      if (ED) { closeEdit(); return; }
      if (!sheet.hidden) { closeSheet(); return; }
      if (ui.open) { ui.open = null; render(); }
    } else if (e.key === 'Tab' && MOD) {
      var mf = Array.prototype.filter.call($('#modal').querySelectorAll('button,input'), function (x) { return !x.disabled; }), m1 = mf[0], m2 = mf[mf.length - 1];
      if (m1 && e.shiftKey && document.activeElement === m1) { e.preventDefault(); m2.focus(); }
      else if (m2 && !e.shiftKey && document.activeElement === m2) { e.preventDefault(); m1.focus(); }
    } else if (e.key === 'Tab' && ED) {
      var ef = Array.prototype.filter.call($('#edit').querySelectorAll('button,input,textarea'), function (x) { return !x.closest('[hidden]') && !x.disabled; }), e1 = ef[0], e2 = ef[ef.length - 1];
      if (e.shiftKey && document.activeElement === e1) { e.preventDefault(); e2.focus(); }
      else if (!e.shiftKey && document.activeElement === e2) { e.preventDefault(); e1.focus(); }
    } else if (e.key === 'Tab' && !sheet.hidden) {
      var f = Array.prototype.filter.call(sheet.querySelectorAll('button,input,select,textarea,a[href]'), function (x) { return !x.disabled && x.offsetParent !== null; }), first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) persistAll(); else { rollDay(); tick(); guardTick(); } });
  window.addEventListener('pagehide', persistAll);
  window.addEventListener('hashchange', function () { setTab(tabFromHash(), true); });

  applySettings();
  applyStatic();
  renderBackup();
  document.documentElement.classList.add('boot');
  setTimeout(function () { document.documentElement.classList.remove('boot'); }, 2200);
  setTab(tabFromHash(), true);
  var fell = checkDecay();
  if (fell) persistAll();
  render();
  if (fell) toast(T('toastRuin'));
  syInit();
  if (!ST.onb && (FRESH || S.demo)) welcomeOpen();
  tick();
  setInterval(tick, 1000);
  setInterval(guardTick, 30000);
})();
</script>

<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
