<title>One-Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: un seul écran. Barre haute (nom + réglages), en-tête (date + anneau du jour), panneau Focus (niveau, objectif, minuteur), deux colonnes (rituels | tâches), archipel d'îles, heatmap. Sombre d'abord; accent et fond réglables. */
:root {
  --bg: #0c0f0d;
  --panel: #131714;
  --panel-2: #181d1a;
  --line: #242b26;
  --faint: #3a443d;
  --fg: #e8eee9;
  --muted: #8c978f;
  --accent: #86f27a;
  --accent-ink: #06210b;
  --cell0: #1a201c;
  --danger: #ff8a7a;
  --warn: #f6c453;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6f2; --panel: #ffffff; --panel-2: #f6f9f5; --line: #dbe3dc; --faint: #b3bfb5;
    --fg: #101611; --muted: #5d695f; --accent: #1c8f3c; --accent-ink: #ffffff; --cell0: #e6ece6; --danger: #c2392b; --warn: #b7791f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f6f2; --panel: #ffffff; --panel-2: #f6f9f5; --line: #dbe3dc; --faint: #b3bfb5;
  --fg: #101611; --muted: #5d695f; --accent: #1c8f3c; --accent-ink: #ffffff; --cell0: #e6ece6; --danger: #c2392b; --warn: #b7791f;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  isolation: isolate;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, p { margin: 0; }

.wrap { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 76px; }

/* Barre haute */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; }
.brand { font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; }
.iconbtn:hover { color: var(--fg); border-color: var(--faint); }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 4px 4px 8px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 7vw, 56px); line-height: 1.02; letter-spacing: -.02em; margin-top: 6px; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 10px; max-width: 34ch; }
.ring { position: relative; width: 116px; height: 116px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--line); stroke-width: 8; }
.ring .bar { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .pct { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .cnt { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.ring.full .pct { color: var(--accent); }

/* Colonnes */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.ph { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 14px; }
.ph h2 { white-space: nowrap; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.check {
  width: 26px; height: 26px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--faint); display: grid; place-items: center;
  transition: background .15s, border-color .15s;
}
.check svg { width: 14px; height: 14px; fill: none; stroke: var(--accent-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.check[aria-pressed="true"] svg { opacity: 1; }
.check:hover { border-color: var(--accent); }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.name { overflow-wrap: anywhere; font-weight: 500; }
.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.link { font-size: 13px; color: var(--accent); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.chip.tt { color: var(--fg); }
.dots { display: flex; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cell0); }
.dot.on { background: var(--accent); }
.dot.off { opacity: .35; }
.name.nm { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 500; text-align: left; cursor: pointer; }
.name.nm:hover { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.done .name.nm:hover { text-decoration: line-through; }
.sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.row.rest .name { color: var(--muted); }
.row.rest .check { opacity: .55; }
.editform { display: flex; flex-direction: column; gap: 20px; }
.editform .lab { margin-bottom: 10px; display: block; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg3 .opt { padding: 9px 6px; font-size: 13px; text-align: center; }
.wdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.wdays .dbtn { min-width: 0; padding: 0; font-family: var(--font-mono); font-size: 12px; }
.ncount { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px; font-family: var(--font-mono); font-size: 14px; }
.ncount .dbtn { width: 38px; font-size: 18px; }
.undo { position: fixed; z-index: 31; left: 50%; transform: translateX(-50%); bottom: calc(136px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 8px 8px 8px 16px; font-weight: 500; }
.undo span { overflow-wrap: anywhere; }
.undo .btn { padding: 7px 12px; white-space: nowrap; }
.streak { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.streak b { color: var(--fg); font-weight: 500; }
.ghost { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: 16px; line-height: 1; }
.ghost:hover { background: var(--panel-2); color: var(--fg); }
.ghost.on { color: var(--accent); }
.ghost.play { color: var(--accent); }
.ghost.play.live { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--accent); }
.ghost.play svg { width: 12px; height: 12px; }
.del:hover { color: var(--danger); }
@media (hover: hover) {
  .del { opacity: 0; }
  .row:hover .del, .del:focus-visible { opacity: 1; }
}

.linkform { flex-basis: 100%; display: flex; gap: 8px; padding-left: 38px; }
.field {
  flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px;
}
.field::placeholder { color: var(--muted); }
.field:focus { outline: none; border-color: var(--accent); }
.btn { background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 10px; padding: 9px 14px; }
.btn.alt { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); }
.iconbtn { position: relative; }
.iconbtn.due::after { content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); }
button:disabled { cursor: default; }
.scrim.mscrim { z-index: 40; }
.sheet.msheet { z-index: 41; }
.msheet .sh-head h2 { text-wrap: balance; }
.obdots { display: flex; gap: 6px; }
.obdot { width: 22px; height: 4px; border-radius: 999px; background: var(--cell0); transition: background-color .3s; }
.obdot.on { background: var(--accent); }
.chips2 { display: flex; flex-wrap: wrap; gap: 8px; }
.chips2 .sbtn { padding: 7px 12px; font-size: 14px; }
.obtips { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 14px; line-height: 1.45; }
.obtips li { padding-left: 16px; position: relative; }
.obtips li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.live.brk { border-style: dashed; }
.btn:disabled { opacity: .45; }
.sw:disabled { opacity: .4; }
.sw .swl { position: absolute; inset: 0; display: grid; place-items: center; font: 600 12px var(--font-mono); color: #0b0f0c; }
.vacban { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: 12px; background: var(--panel); }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.sumt { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sumt b { font-family: var(--font-display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bars { display: flex; align-items: stretch; gap: 6px; height: 160px; }
.bcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bwrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.bwrap i { display: block; width: 100%; max-width: 36px; border-radius: 5px 5px 2px 2px; background: color-mix(in srgb, var(--accent) 45%, var(--cell0)); min-height: 2px; transition: height .5s cubic-bezier(.2, .8, .2, 1); }
.bcol.cur .bwrap i { background: var(--accent); }
.bcol em, .bcol u { font-style: normal; text-decoration: none; font-family: var(--font-mono); font-size: 10px; color: var(--muted); white-space: nowrap; height: 13px; }
.bcol u { color: var(--fg); }
.stnav { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 6px; min-width: 0; }
.stnav .meta, .stnav .btn { white-space: nowrap; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow .nm { overflow-wrap: anywhere; font-weight: 500; }
.trow .tv { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tbar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--cell0); overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.ach { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ach b { font-weight: 600; overflow-wrap: anywhere; }
.ach span { font-size: 12px; color: var(--muted); }
.ach .ok { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.ach.lock { opacity: .5; }
.bkrow { display: flex; gap: 8px; flex-wrap: wrap; }
.bkrow .btn { flex: 1 1 120px; }
.bkinfo { font-size: 13px; color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
.bkinfo.due { color: var(--accent); }
#sySec .bkrow + .bkrow, #sySec .bkinfo + .bkrow { margin-top: 8px; }
.sycol { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.bkmsg { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
.bkmsg textarea { width: 100%; min-height: 84px; resize: vertical; font: 11px/1.4 var(--font-mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.addform { display: flex; gap: 8px; margin-top: 12px; }
.empty { color: var(--muted); padding: 10px 0 4px; }

/* Focus */
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
.fblock { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.fblock .lab { margin: 0; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -.01em; line-height: 1.1; overflow-wrap: anywhere; }
.big small { font-family: var(--font-mono); font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.small { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.xpbar { height: 8px; border-radius: 999px; background: var(--cell0); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.durs { display: flex; flex-wrap: wrap; gap: 6px; }
.dur { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 6px 12px; font-family: var(--font-mono); font-size: 13px; }
.dur:hover { border-color: var(--faint); }
.dur[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.guard { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.guard.warn .small { color: var(--danger); font-weight: 500; }
.guard.warn .xpbar i { background: var(--danger); }
.ruin { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 16px; margin-bottom: 16px; border: 1px dashed var(--danger); border-radius: 12px; background: var(--panel-2); }
.ruin-img { width: min(220px, 100%); flex: none; }
.ruin-img svg { display: block; width: 100%; height: auto; }
.ruin-txt { flex: 1; min-width: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.live { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 16px; margin-bottom: 22px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; }
.live-isle { width: min(400px, 100%); flex: none; padding: 10px 6px 4px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 9%, var(--panel)) 0%, var(--panel) 62%, color-mix(in srgb, #4f9ed0 14%, var(--panel)) 100%); }
.live-isle svg { display: block; width: 100%; height: auto; overflow: visible; }
.bp { transform-box: fill-box; transform-origin: 50% 100%; transition: opacity 1.1s linear, transform 1.1s linear; }
.crane { transition: opacity .6s; }
.hook { transform-box: view-box; transform-origin: 116px 29px; animation: sway 3.4s ease-in-out infinite alternate; }
#liveSvg.idle .hook { animation-play-state: paused; }
@keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
.step { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .bp { transition: none; } .hook { animation: none; } }
.live-body { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 8px; }
.ltask { font-family: var(--font-display); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; }
.time { font-family: var(--font-mono); font-size: clamp(40px, 9vw, 60px); line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; }

/* Archipel */
.arch { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.isle { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.isle svg { width: 100%; max-width: 190px; height: auto; display: block; }
.isle figcaption { text-align: center; font-size: 13px; min-width: 0; display: flex; flex-direction: column; }
.isle figcaption b { font-weight: 600; }
.isle figcaption span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.arch .isle svg { animation: bob 5s ease-in-out infinite; }
.arch .isle:nth-child(3n+2) svg { animation-delay: -1.7s; }
.arch .isle:nth-child(3n) svg { animation-delay: -3.2s; }
/* Liquid Glass : fond coloré fixe + surfaces translucides avec flou, reflet et bord lumineux */
.glassbg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .6s ease; }
.glassbg::before { content: ""; position: absolute; inset: -20%; background:
  radial-gradient(40% 36% at 18% 14%, color-mix(in srgb, var(--accent) 62%, transparent), transparent 72%),
  radial-gradient(36% 40% at 86% 24%, rgba(110, 140, 255, .55), transparent 72%),
  radial-gradient(44% 40% at 72% 90%, rgba(255, 110, 200, .42), transparent 72%),
  radial-gradient(40% 40% at 8% 86%, rgba(60, 220, 200, .42), transparent 72%);
  animation: gdrift 30s ease-in-out infinite alternate; }
@keyframes gdrift { to { transform: translate3d(3%, -2%, 0) scale(1.07); } }
:root[data-glass="on"] .glassbg { opacity: 1; }
:root[data-glass="off"] .glassbg::before { animation-play-state: paused; }
:root[data-glass="on"] { --glass-blur: blur(26px) saturate(1.8); }
:root[data-glass="on"][data-theme="dark"] { --bg: #070a10; --panel: rgba(255, 255, 255, .075); --panel-2: rgba(255, 255, 255, .085); --line: rgba(255, 255, 255, .17); --faint: rgba(255, 255, 255, .32); --muted: #b3beb7; --cell0: rgba(255, 255, 255, .11); --glass-edge: rgba(255, 255, 255, .36); --glass-sheen: rgba(255, 255, 255, .13); --glass-shadow: 0 10px 34px rgba(0, 0, 0, .38); }
:root[data-glass="on"][data-theme="light"] { --bg: #dde6f2; --panel: rgba(255, 255, 255, .52); --panel-2: rgba(255, 255, 255, .5); --line: rgba(24, 36, 48, .13); --faint: rgba(24, 36, 48, .3); --muted: #4d5a66; --cell0: rgba(24, 36, 48, .08); --glass-edge: rgba(255, 255, 255, .95); --glass-sheen: rgba(255, 255, 255, .6); --glass-shadow: 0 10px 34px rgba(40, 60, 110, .2); }
:root[data-glass="on"] :is(.panel, .tabs, .sheet, .iconbtn, .toast, .ruin) {
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  background-image: linear-gradient(145deg, var(--glass-sheen), transparent 55%);
  box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 -1px 0 rgba(255, 255, 255, .05), var(--glass-shadow);
}
:root[data-glass="on"] :is(.panel, .sheet) { border-radius: 22px; }
:root[data-glass="on"] :is(.tabs, .tab, .tabind) { border-radius: 999px; }
:root[data-glass="on"] :is(.day, .ctile, .citybtn, .opt, .field, .btn.alt, .live-isle, .isle) { box-shadow: inset 0 1px 0 var(--glass-edge); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root[data-glass="on"][data-theme="dark"] { --panel: rgba(24, 30, 38, .92); --panel-2: rgba(32, 40, 50, .92); }
  :root[data-glass="on"][data-theme="light"] { --panel: rgba(255, 255, 255, .92); --panel-2: rgba(246, 249, 252, .92); }
}

      lg.forEach(function (id) { o.hab[id] = (o.hab[id] || 0) + 1; });
      if (v > o.bestV) { o.bestV = v; o.best = k; }
      var bt = F.bt[k] || {}; Object.keys(bt).forEach(function (n) { o.tasks[n] = (o.tasks[n] || 0) + bt[n]; });

      if (v) S.tasks.push({ id: uid(), text: v, date: ui.calSel < today ? today : ui.calSel, done: false, diff: ui.newDiff, proj: ui.proj || '' });
    } else if (f.id === 'projForm') {
      if (v) { var np = { id: uid(), name: v, c: projs().length % PCOL.length }; projs().push(np); ui.proj = np.id; }
      ui.addProj = false;
    } else if (f.id === 'habitForm') {
      if (v) S.habits.push({ id: uid(), name: v });
      f.reset();
    } else if (f.classList.contains('linkform')) {
      setLink(f.dataset.id, v);
      ui.open = null;
    }
    afterToggle();
    render();
    if (f.id === 'calForm' && $('#calInput')) $('#calInput').focus();
  });

  document.addEventListener('keydown', function (e) {
    var sheet = $('#sheet');
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute && e.target.getAttribute('role') === 'tab') {
      var ni = (TABS.indexOf(ui.tab) + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
      setTab(TABS[ni]); $('#tabbtn-' + TABS[ni]).focus(); return;
    }
    if (e.key === 'Escape') {
      if (MOD) { modalClose(); return; }
      if (ED) { closeEdit(); return; }
      if (!sheet.hidden) { closeSheet(); return; }
      if (ui.open) { ui.open = null; render(); }
    } else if (e.key === 'Tab' && MOD) {
      var mf = Array.prototype.filter.call($('#modal').querySelectorAll('button,input'), function (x) { return !x.disabled; }), m1 = mf[0], m2 = mf[mf.length - 1];
      if (m1 && e.shiftKey && document.activeElement === m1) { e.preventDefault(); m2.focus(); }
      else if (m2 && !e.shiftKey && document.activeElement === m2) { e.preventDefault(); m1.focus(); }
    } else if (e.key === 'Tab' && ED) {
      var ef = Array.prototype.filter.call($('#edit').querySelectorAll('button,input'), function (x) { return !x.closest('[hidden]'); }), e1 = ef[0], e2 = ef[ef.length - 1];
      if (e.shiftKey && document.activeElement === e1) { e.preventDefault(); e2.focus(); }
      else if (!e.shiftKey && document.activeElement === e2) { e.preventDefault(); e1.focus(); }
    } else if (e.key === 'Tab' && !sheet.hidden) {
      var f = sheet.querySelectorAll('button'), first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) persistAll(); else { rollDay(); tick(); guardTick(); } });
  window.addEventListener('pagehide', persistAll);
  window.addEventListener('hashchange', function () { setTab(tabFromHash(), true); });

  applySettings();
  applyStatic();
  renderBackup();
  document.documentElement.classList.add('boot');
  setTimeout(function () { document.documentElement.classList.remove('boot'); }, 2200);
  setTab(tabFromHash(), true);
  var fell = checkDecay();
  if (fell) persistAll();
  render();
  if (fell) toast(T('toastRuin'));
  syInit();
  if (!ST.onb && (FRESH || S.demo)) welcomeOpen();
  tick();
  setInterval(tick, 1000);
  setInterval(guardTick, 30000);
})();
</script>
